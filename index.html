<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPED Fiscal Editor Pro</title>
    <meta property="og:title" content="SPED Fiscal Editor Pro" />
    <meta name="description" content="Editor e analisador web profissional de arquivos SPED EFD ICMS/IPI e CT-e XML com validação PVA, análise de CFOP, dashboard fiscal e exportação" />
    <meta property="og:description" content="Editor e analisador web profissional de arquivos SPED EFD ICMS/IPI e CT-e XML com validação PVA, análise de CFOP, dashboard fiscal e exportação" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sped_theme_preference');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Google Fonts for crisp accounting/ERP UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
